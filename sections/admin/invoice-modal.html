<div id="invoiceModal" class="invoice-modal">

    <div class="invoice-container">

        <div class="invoice-top">

            <div>
                <h1>M&N Consumer Goods</h1>

                <p>
                    Retail • Wholesale • Distribution
                </p>
            </div>

            <div class="invoice-actions">

                <button id="printInvoiceBtn">
                    Print Invoice
                </button>

                <button id="closeInvoiceBtn">
                    Close
                </button>

            </div>

        </div>

        <div class="invoice-details">

            <div>
                <strong>Invoice ID:</strong>
                <span id="invoiceIdText">-</span>
            </div>

            <div>
                <strong>Customer:</strong>
                <span id="invoiceCustomerText">-</span>
            </div>

            <div>
                <strong>Order Type:</strong>
                <span id="invoiceOrderTypeText">-</span>
            </div>

            <div>
                <strong>Total Amount:</strong>
                ₱<span id="invoiceTotalText">0</span>
            </div>

        </div>

        <div class="invoice-signature">

            <h3>Customer Signature</h3>

            <img id="invoiceSignatureImage" src="" alt="Signature">

        </div>

    </div>

</div>
