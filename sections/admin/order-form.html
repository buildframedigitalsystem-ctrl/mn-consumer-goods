<div class="form-page">

    <div class="page-top">
        <h1>Orders</h1>
        <p>Create customer orders with signature</p>
    </div>

    <div class="form-card">

        <form id="orderForm">

            <div class="form-grid order-form-grid">

                <div class="form-group">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" required>
                </div>

                <div class="form-group">
                    <label for="contactNumber">Contact Number</label>
                    <input type="text" id="contactNumber">
                </div>

                <div class="form-group">
                    <label for="orderType">Order Type</label>
                    <select id="orderType">
                        <option value="Retail">Retail</option>
                        <option value="Wholesale">Wholesale</option>
                        <option value="Reseller">Reseller</option>
                        <option value="Distribution">Distribution</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="paymentStatus">Payment Status</label>
                    <select id="paymentStatus">
                        <option value="Unpaid">Unpaid</option>
                        <option value="Partial">Partial</option>
                        <option value="Paid">Paid</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productSelect">Select Product</label>
                    <select id="productSelect">
                        <option value="">Loading products...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productQuantity">Quantity</label>
                    <input type="number" id="productQuantity" min="1" value="1">
                </div>

                <div class="form-group">
                    <label>&nbsp;</label>
                    <button type="button" id="addToCartBtn" class="primary-btn full-width-btn">
                        + Add Product To Cart
                    </button>
                </div>

                <div class="form-group full-row">
                    <div class="table-scroll-box">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Qty</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                    <th>Action</th>
                                </tr>
                            </thead>

                            <tbody id="cartTableBody">
                                <tr>
                                    <td colspan="5">No products added.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="form-group">
                    <label for="totalAmount">Total Amount</label>
                    <input type="number" id="totalAmount" readonly value="0">
                </div>

                <div class="form-group">
                    <label for="orderNotes">Order Notes</label>
                    <input type="text" id="orderNotes">
                </div>

                <div class="form-group full-row">
                    <label for="signatureCanvas">Customer Signature</label>

                    <div class="signature-box">
                        <canvas id="signatureCanvas" width="700" height="150"></canvas>
                    </div>

                    <button type="button" id="clearSignatureBtn" class="secondary-btn">
                        Clear Signature
                    </button>
                </div>

            </div>

            <button type="submit" id="submitOrderBtn" class="primary-btn">
                Save Order
            </button>

        </form>

    </div>

    <div class="table-card">
        <div class="table-scroll-box">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Type</th>
                        <th>Total</th>
                        <th>Payment</th>
                        <th>Status</th>
                        <th>Invoice</th>
                    </tr>
                </thead>

                <tbody id="ordersTableBody">
                    <tr>
                        <td colspan="7">Loading orders...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
