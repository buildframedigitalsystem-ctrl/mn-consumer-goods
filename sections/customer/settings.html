<section class="dashboard-section">
    <h1>Customer Settings</h1>
    <p>Manage customer profile, delivery information, and contact details.</p>

    <form class="dashboard-form">
        <label>Full Name</label>
        <input type="text" id="customerName" placeholder="Customer full name">

        <label>Email</label>
        <input type="email" id="customerEmail" placeholder="Customer email">

        <label>Contact Number</label>
        <input type="text" id="customerPhone" placeholder="Customer contact number">

        <label>Delivery Address</label>
        <textarea id="customerAddress" placeholder="Customer delivery address"></textarea>

        <button type="button">Save Changes</button>
    </form>
</section>
