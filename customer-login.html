<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Customer Login</title>

    <link rel="stylesheet" href="assets/css/customer-login.css">
</head>

<body>

    <section class="login-page">

        <div class="login-card">

            <div class="login-left">
                <div class="overlay">
                    <h2>M&N Consumer Goods</h2>
                    <p>Access your retail or wholesale customer account.</p>
                </div>
            </div>

            <div class="login-right">

                <h1>Customer Login</h1>

                <p>
                    Login to track orders, view order history,
                    and manage your M&N customer account.
                </p>

                <form id="customerLoginForm">

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                </form>

                <div class="signup-link">
                    No account yet?
                    <a href="customer-signup.html">Create Account</a>
                </div>

            </div>

        </div>

    </section>

    <script src="assets/js/customer-login.js"></script>

</body>

</html>
