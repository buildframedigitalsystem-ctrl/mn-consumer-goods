<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Store Partner Login</title>

    <link rel="stylesheet" href="assets/css/customer-login.css">
    <link rel="stylesheet" href="assets/css/responsive-fixes.css">
</head>

<body>

    <section class="login-page">

        <div class="login-card">

            <div class="login-left">
                <div class="overlay">
                    <h2>M&N Store Network</h2>
                    <p>Secure access for approved store partners and wholesale accounts.</p>
                </div>
            </div>

            <div class="login-right">

                <h1>Store Partner Login</h1>

                <p>
                    Login to access your store account, submit wholesale orders,
                    track deliveries, view balances, and manage payments.
                </p>

                <form id="customerLoginForm">

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="loginEmail" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>

                    <button type="submit" class="login-btn">
                        Login to Store App
                    </button>

                </form>

                <div class="signup-link">
                    New store partner?
                    <a href="customer-signup.html">Apply / Create Store Account</a>
                </div>

            </div>

        </div>

    </section>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/customer-login.js"></script>


</body>

</html>
