<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Store Reports</title>

    <link rel="manifest" href="manifest-store.json">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/store.css">

    <meta name="theme-color" content="#005f2f">
</head>

<body>

    <header class="store-header">

        <div class="store-logo">
            <h1>M&N Store</h1>
            <p>Store Reports</p>
        </div>

        <nav class="store-nav">
            <a href="store-dashboard.html">Dashboard</a>
            <a href="wholesale.html">Products</a>
            <a href="store-invoices.html">Invoices</a>
            <a href="store-payments.html">Payments</a>
        </nav>

    </header>

    <main class="store-container">

        <section class="page-hero">
            <h2>Store Reports</h2>

            <p>
                Monitor your purchases, invoices,
                balances, and order activity.
            </p>
        </section>

        <section class="dashboard-card">

            <div class="report-grid">

                <div class="report-card">
                    <h3>Total Orders</h3>
                    <p>0</p>
                </div>

                <div class="report-card">
                    <h3>Total Purchases</h3>
                    <p>₱0.00</p>
                </div>

                <div class="report-card">
                    <h3>Pending Balance</h3>
                    <p>₱0.00</p>
                </div>

                <div class="report-card">
                    <h3>Completed Deliveries</h3>
                    <p>0</p>
                </div>

            </div>

        </section>

    </main>
