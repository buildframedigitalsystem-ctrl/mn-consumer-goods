<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Supplier Login</title>

    <link rel="stylesheet" href="assets/css/supplier-login.css">
    <link rel="stylesheet" href="assets/css/responsive-fixes.css">

    <link rel="stylesheet" href="assets/css/responsive-fixes.css">

</head>

<body>

    <section class="supplier-login-page">

        <div class="supplier-login-card">

            <div class="supplier-login-left">
                <div class="overlay">
                    <h2>M&N Supplier Portal</h2>
                    <p>Access purchase orders, product receiving, and supplier records.</p>
                </div>
            </div>

            <div class="supplier-login-right">

                <h1>Supplier Login</h1>

                <p>
                    This portal is for M&N suppliers and partner distributors.
                </p>

                <form id="supplierLoginForm">

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="supplierEmail" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="supplierPassword" required>
                    </div>

                    <button type="submit" class="supplier-login-btn">
                        Login
                    </button>

                </form>

                <div class="back-link">
                    <a href="index.html">← Back to Store</a>
                </div>

            </div>

        </div>

    </section>

    <script src="assets/js/supplier-login.js"></script>

</body>

</html>
