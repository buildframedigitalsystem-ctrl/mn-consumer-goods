<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Customer Signup</title>

    <link rel="stylesheet" href="assets/css/customer-signup.css">
</head>

<body>

    <!-- =========================
         SIGNUP CONTAINER
    ========================== -->
    <section class="signup-page">

        <div class="signup-card">

            <!-- LEFT -->
            <div class="signup-left">

                <h1>Create Account</h1>

                <p>
                    Join M&N Consumer Goods and start ordering products
                    for retail or wholesale transactions.
                </p>

                <form id="customerSignupForm">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="text" id="mobile" required>
                    </div>

                    <div class="form-group">
                        <label>Customer Type</label>

                        <select id="customerType" required>
                            <option value="">Select Type</option>
                            <option value="Retail">Retail Customer</option>
                            <option value="Wholesale">Wholesale Customer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required>
                    </div>

                    <button type="submit" class="signup-btn">
                        Create Account
                    </button>

                </form>

                <div class="login-link">
                    Already have an account?
                    <a href="customer-login.html">Login Here</a>
                </div>

            </div>

            <!-- RIGHT -->
            <div class="signup-right">

                <div class="overlay">

                    <h2>M&N Consumer Goods</h2>

                    <p>
                        Wholesale and Retail Distribution Platform
                    </p>

                </div>

            </div>

        </div>

    </section>

    <script src="assets/js/customer-signup.js"></script>

</body>

</html>
