<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Store Partner Signup</title>

    <link rel="stylesheet" href="assets/css/customer-signup.css">
    <link rel="stylesheet" href="assets/css/responsive-fixes.css">

</head>

<body>

    <section class="signup-page">

        <div class="signup-card">

            <div class="signup-left">

                <h1>Create Store Partner Account</h1>

                <p>
                    Apply as an official M&N Store Partner,
                    reseller, wholesale outlet, or distributor.
                </p>

                <form id="customerSignupForm">

                    <div class="form-group">
                        <label>Store / Business Name</label>
                        <input type="text" id="fullName" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="text" id="mobile" required>
                    </div>

                    <div class="form-group">
                        <label>Store Type</label>

                        <select id="customerType" required>
                            <option value="">Select Type</option>
                            <option value="Store Partner">Store Partner</option>
                            <option value="Wholesale Outlet">Wholesale Outlet</option>
                            <option value="Distributor">Distributor</option>
                            <option value="Reseller">Reseller</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required>
                    </div>

                    <button type="submit" class="signup-btn">
                        Create Store Account
                    </button>

                </form>

                <div class="login-link">
                    Already approved?
                    <a href="customer-login.html">
                        Login Here
                    </a>
                </div>

            </div>

            <div class="signup-right">

                <div class="overlay">

                    <h2>M&N Store Network</h2>

                    <p>
                        Wholesale Distribution • Store Partners • Reseller Network
                    </p>

                    <a href="index.html" class="back-store-link">
                        ← Back to Store App
                    </a>

                </div>

            </div>

        </div>

    </section>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/customer-signup.js"></script>

</body>

</html>
