<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Customer Signup</title>

    <link rel="stylesheet" href="assets/css/customer-signup.css">
</head>

<body>

    <section class="signup-page">

        <div class="signup-card">

            <div class="signup-left">

                <h1>Create Account</h1>

                <p>
                    Join M&N Consumer Goods as a customer, reseller,
                    agent, or wholesale buyer.
                </p>

                <form id="customerSignupForm">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="fullName" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number</label>
                        <input type="text" id="mobile" required>
                    </div>

                    <div class="form-group">
                        <label>Account Type</label>

                        <select id="customerType" required>
                            <option value="">Select Type</option>
                            <option value="Regular Customer">Regular Customer</option>
                            <option value="Reseller">Reseller</option>
                            <option value="Agent">Agent</option>
                            <option value="Wholesale Buyer">Wholesale Buyer</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required>
                    </div>

                    <button type="submit" class="signup-btn">
                        Create Account
                    </button>

                </form>

                <div class="login-link">
                    Already have an account?
                    <a href="customer-login.html">Login Here</a>
                </div>

                <div class="login-link">
                    Need business pricing?
                    <a href="quotation-request.html">Request Quotation</a>
                </div>

            </div>

            <div class="signup-right">

                <div class="overlay">

                    <h2>M&N Consumer Goods</h2>

                    <p>
                        Wholesale, Retail, Reseller, and Agent Distribution Platform
                    </p>

                    <a href="index.html" class="back-store-link">
                        ← Back to Store
                    </a>

                </div>

            </div>

        </div>

    </section>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/customer-signup.js"></script>

</body>

</html>
