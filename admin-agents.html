<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Agents | M&N OS</title>

    <link rel="manifest" href="manifest-admin.json">
    <meta name="theme-color" content="#07152f">

    <link rel="stylesheet" href="assets/css/base.css?v=2">
    <link rel="stylesheet" href="assets/css/admin-layout.css?v=2">
    <link rel="stylesheet" href="assets/css/admin-dashboard.css?v=2">
    <link rel="stylesheet" href="assets/css/admin-forms.css?v=2">

    <style>
        body {
            background: #eef2f7;
        }
    </style>
</head>

<body>

    <main class="admin-standalone-page">

        <a href="admin-dashboard.html" class="admin-back-link">
            ← Back to Control Center
        </a>

        <section class="admin-page-hero">
            <span>AGENT MANAGEMENT</span>

            <h1>Agents / Resellers</h1>

            <p>
                Manage agents, assigned areas, login access,
                commission rates, and store partner assignments.
            </p>
        </section>

        <section class="admin-form-card">

            <h2>Add / Update Agent</h2>

            <form id="agentForm" class="admin-form-grid">

                <input type="hidden" id="agentId">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" required>
                </div>

                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="contactNumber">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <div class="form-group">
                    <label>Assigned Area</label>
                    <input type="text" id="assignedArea">
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="text" id="password">
                </div>

                <div class="form-group">
                    <label>Commission Rate (%)</label>
                    <input type="number" id="commissionRate" min="0" step="0.01" value="0">
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="agentStatus">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                        <option value="On Hold">On Hold</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Notes</label>
                    <textarea id="notes"></textarea>
                </div>

                <div class="form-group full-width">
                    <button type="submit" class="save-btn">
                        Save Agent
                    </button>

                    <button type="button" class="secondary-btn" onclick="resetAgentForm_()">
                        Clear
                    </button>
                </div>

            </form>

        </section>

        <section class="admin-table-card">

            <h2>Agent Records</h2>

            <div class="table-wrapper">

                <table class="admin-table">

                    <thead>
                        <tr>
                            <th>Agent ID</th>
                            <th>Full Name</th>
                            <th>Contact</th>
                            <th>Email</th>
                            <th>Area</th>
                            <th>Commission</th>
                            <th>Status</th>
                            <th>Stores</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="agentsTableBody">
                        <tr>
                            <td colspan="9">Loading agents...</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/admin-agents.js"></script>

</body>

</html>
