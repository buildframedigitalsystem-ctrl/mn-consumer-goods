<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M&N Agent Login</title>

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/admin-login.css">
    <link rel="stylesheet" href="assets/css/responsive-fixes.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <img src="assets/branding/mn-logo.png" class="login-logo" alt="M&N Logo">

            <h1>Agent / Reseller Login</h1>

            <p>
                Access your reseller and agent dashboard.
            </p>

            <form id="agentLoginForm">

                <input type="email" id="email" placeholder="Email Address" required>

                <input type="password" id="password" placeholder="Password" required>

                <button type="submit">
                    Login
                </button>

            </form>

            <div id="agentLoginMessage"></div>

            <a href="index.html" class="back-home">
                ← Back to Homepage
            </a>

        </div>

    </div>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/agent-login.js"></script>

</body>

</html>
