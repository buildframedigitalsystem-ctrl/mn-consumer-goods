<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M&N Store Order Form</title>

    <link rel="manifest" href="manifest-store.json">
    <meta name="theme-color" content="#005f2f">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #0f172a;
        }

        .order-page {
            max-width: 1180px;
            margin: auto;
            padding: 35px 22px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            background: white;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .brand h1 {
            margin: 0;
            font-size: 32px;
        }

        .brand p {
            margin: 6px 0 0;
            color: #64748b;
        }

        .back-link {
            background: #005f2f;
            color: white;
            text-decoration: none;
            padding: 13px 18px;
            border-radius: 14px;
            font-weight: 800;
        }

        .order-card {
            background: white;
            border-radius: 26px;
            padding: 32px;
            margin-bottom: 28px;
            box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08);
        }

        .section-title {
            margin-top: 0;
            margin-bottom: 22px;
            font-size: 24px;
        }

        .order-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label,
        .signature-section label {
            font-weight: 800;
            margin-bottom: 8px;
            color: #334155;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            font-size: 15px;
            background: #f8fafc;
        }

        .form-group textarea {
            resize: vertical;
        }

        .wide-field {
            grid-column: span 2;
        }

        .signature-section {
            margin-top: 26px;
        }

        #signatureCanvas {
            width: 100%;
            height: 220px;
            border: 2px dashed #94a3b8;
            border-radius: 18px;
            background: #f8fafc;
        }

        .order-actions {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 24px;
        }

        .clear-btn,
        .save-btn {
            border: none;
            padding: 15px 24px;
            border-radius: 14px;
            font-weight: 900;
            cursor: pointer;
            font-size: 15px;
        }

        .clear-btn {
            background: #e2e8f0;
            color: #0f172a;
        }

        .save-btn {
            background: #005f2f;
            color: white;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }

        .orders-table th,
        .orders-table td {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        .orders-table th {
            background: #f8fafc;
            color: #334155;
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
            }

            .order-grid {
                grid-template-columns: 1fr;
            }

            .wide-field {
                grid-column: span 1;
            }

            .brand h1 {
                font-size: 26px;
            }

            .order-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="order-page">

        <div class="top-bar">
            <div class="brand">
                <img src="assets/images/branding/mn-logo.png" alt="M&N Logo">

                <div>
                    <h1>Store Order Form</h1>
                    <p>Retail • Wholesale • Reseller • Distribution Orders</p>
                </div>
            </div>

            <a href="store-dashboard.html" class="back-link">
                ← Store Operations
            </a>
        </div>

        <section class="order-card">

            <h2 class="section-title">Create New Order</h2>

            <form id="orderForm">

                <div class="order-grid">

                    <div class="form-group">
                        <label for="customerName">Customer / Store Name</label>
                        <input type="text" id="customerName" required>
                    </div>

                    <div class="form-group">
                        <label for="contactNumber">Contact Number</label>
                        <input type="text" id="contactNumber" required>
                    </div>

                    <div class="form-group">
                        <label for="orderType">Order Type</label>
                        <select id="orderType" required>
                            <option value="">Select Order Type</option>
                            <option value="Retail">Retail</option>
                            <option value="Wholesale">Wholesale</option>
                            <option value="Reseller">Reseller</option>
                            <option value="Distribution">Distribution</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="paymentStatus">Payment Status</label>
                        <select id="paymentStatus" required>
                            <option value="Unpaid">Unpaid</option>
                            <option value="Partial">Partial</option>
                            <option value="Paid">Paid</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="productSelect">Select Product</label>
                        <select id="productSelect">
                            <option value="">Loading products...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="productQuantity">Quantity</label>
                        <input type="number" id="productQuantity" min="1" value="1">
                    </div>

                    <div class="form-group wide-field">
                        <button type="button" id="addToCartBtn" class="save-btn">
                            + Add Product To Cart
                        </button>
                    </div>

                    <div class="form-group wide-field">
                        <div id="cartContainer">
                            <table class="orders-table">
                                <thead>
                                    <tr>
                                        <th>Product</th>
                                        <th>Qty</th>
                                        <th>Price</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>

                                <tbody id="cartTableBody">
                                    <tr>
                                        <td colspan="4">No products added.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="totalAmount">Total Amount</label>
                        <input type="number" id="totalAmount" readonly value="0">
                    </div>

                    <div class="form-group wide-field">
                        <label for="orderNotes">Order Notes</label>
                        <textarea id="orderNotes" rows="4"></textarea>
                    </div>

                    <div class="signature-section">
                        <label for="signatureCanvas">Customer / Receiver Signature</label>
                        <canvas id="signatureCanvas" width="700" height="220"></canvas>
                    </div>

                    <div class="order-actions">
                        <button type="button" id="clearSignatureBtn" class="clear-btn">
                            Clear Signature
                        </button>

                        <button type="submit" id="submitOrderBtn" class="save-btn">
                            Submit Order
                        </button>
                    </div>

            </form>

        </section>

        <section class="order-card">

            <h2 class="section-title">Recent Orders</h2>

            <div class="table-wrap">
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Type</th>
                            <th>Total</th>
                            <th>Payment</th>
                            <th>Status</th>
                            <th>Invoice</th>
                        </tr>
                    </thead>

                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="7">Loading orders...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </div>

    <div id="invoiceModalContainer"></div>

    <script src="assets/js/api-config.js"></script>
    <script src="assets/js/invoice.js"></script>
    <script src="assets/js/orders.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initializeOrders();
        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./service-worker.js");
        }
    </script>

</body>

</html>
